<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosscurrent</title>
<style>
  :root{
    --bg:#fff; --ink:#16232f; --body:#3d4f61; --soft:#6b7f92; --faint:#95a5b5;
    --rule:#e4eaf0; --panel:#f7f9fb;
    --us:#1f5fa9; --us-s:#eef4fb;
    --hk:#0d8a6a; --hk-s:#e9f7f2;
    --cn:#c8342b; --cn-s:#fdf1f0;
    --up:#137a4d; --down:#b3392e;
    --sans:Calibri,"Segoe UI",Candara,"Avenir Next","Trebuchet MS","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);
    font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px 80px}
  h1,h2,h3{color:var(--ink);font-weight:600;letter-spacing:-.015em;margin:0}
  h1{font-size:36px;line-height:1.15}
  h3{font-size:13.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
     font-weight:600;margin-bottom:12px}

  header{padding:52px 0 18px}
  .brand{font-size:46px;letter-spacing:-.025em}
  .lede{font-size:19px;color:var(--soft);max-width:60ch;margin:8px 0 0}

  /* quote line in the list */
  .row .px{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;
    color:var(--ink);font-size:15px}
  .row .chg{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
  .asof{color:var(--faint);font-size:12.5px;margin-left:6px}

  /* detail: the read sits directly under the name */
  .dread{font-size:16.5px;color:var(--body);max-width:74ch;margin:10px 0 0}
  .about{border:1px solid var(--rule);border-radius:10px;padding:18px 20px;
    margin-bottom:22px}
  .about p{margin:0;font-size:14.5px;line-height:1.62;color:var(--body)}
  .quotebar{display:flex;align-items:baseline;gap:12px;margin-top:12px;flex-wrap:wrap}
  .quotebar .big{font-size:32px;font-weight:600;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .quotebar .mv{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}

  .searchbar{position:relative;margin:26px 0 14px}
  #q{width:100%;padding:16px 18px 16px 48px;font-size:18px;font-family:var(--sans);
    border:2px solid var(--rule);border-radius:10px;color:var(--ink);outline:none}
  #q:focus{border-color:var(--cn)}
  .searchbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:19px;height:19px;fill:none;stroke:var(--faint);stroke-width:2}
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:7px}
  .chip{border:1px solid var(--rule);background:#fff;color:var(--soft);padding:5px 13px;
    border-radius:18px;font-size:13.5px;cursor:pointer;font-family:var(--sans)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .count{color:var(--faint);font-size:14px;margin:10px 0 14px}

  .rows{border:1px solid var(--rule);border-radius:10px;overflow:hidden}
  .row{display:grid;grid-template-columns:74px 1fr 116px 92px 128px;gap:12px;
    padding:11px 15px;align-items:center;border-bottom:1px solid var(--rule);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--panel)}
  .row .code{font-size:13.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .row .nm{font-weight:600;color:var(--ink);line-height:1.3}
  .row .sub{font-size:12.5px;color:var(--faint);font-weight:400}
  .row .num{text-align:right;font-variant-numeric:tabular-nums;font-size:14.5px}
  .row .up{color:var(--up)} .row .dn{color:var(--down)}
  .tagm{font-size:11.5px;padding:2px 8px;border-radius:12px;text-align:center;
    display:inline-block;white-space:nowrap}
  .t-us{background:var(--us-s);color:var(--us)}
  .t-hk{background:var(--hk-s);color:var(--hk)}
  .t-cn{background:var(--cn-s);color:var(--cn)}
  .t-none{background:#f0f2f4;color:var(--soft)}
  .more{text-align:center;padding:16px;color:var(--soft);cursor:pointer;
    border:1px solid var(--rule);border-radius:10px;margin-top:12px}
  .more:hover{background:var(--panel)}

  /* detail */
  #detail{display:none}
  .back{background:none;border:none;color:var(--cn);font-size:15.5px;cursor:pointer;
    padding:0;font-family:var(--sans);font-weight:600;margin:30px 0 18px}
  .dhead{border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:22px}
  .dmeta{color:var(--soft);font-size:15px;margin-top:6px}
  .dmeta b{color:var(--body)}
  .summary{font-size:16px;max-width:76ch;margin-top:14px}
  .read{background:var(--panel);border-left:4px solid var(--cn);border-radius:0 9px 9px 0;
    padding:16px 20px;margin:20px 0}
  .read ul{margin:0;padding-left:18px} .read li{margin-bottom:6px}
  .read li:last-child{margin-bottom:0}

  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
    background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;
    margin-bottom:22px}
  .m{padding:12px 15px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .m .k{font-size:12px;color:var(--faint);margin-bottom:2px}
  .m .v{font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .m .v.up{color:var(--up)} .m .v.dn{color:var(--down)}

  .box{border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-bottom:22px}
  .chart{width:100%;height:auto;display:block;overflow:visible}
  .evlist{margin-top:14px;font-size:14.5px}
  .ev{display:flex;gap:11px;padding:6px 0;border-top:1px solid var(--rule)}
  .ev .dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px}
  .ev .d{color:var(--faint);font-variant-numeric:tabular-nums;flex:none;width:88px}

  /* three markets */
  .mk{border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin:26px 0}
  .mk-head{background:var(--ink);color:#fff;padding:14px 20px}
  .mk-head .t{font-size:18px;font-weight:600}
  .mk-head .s{font-size:13.5px;opacity:.75;margin-top:2px}
  .mk-grid{display:grid;grid-template-columns:repeat(3,1fr)}
  .mkc{padding:17px 19px;border-right:1px solid var(--rule)}
  .mkc:last-child{border-right:none}
  .mkc .who{font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}
  .mkc.us .who{color:var(--us)} .mkc.hk .who{color:var(--hk)} .mkc.cn .who{color:var(--cn)}
  .mkc .bench{font-size:12px;color:var(--faint);margin-bottom:9px}
  .mkc .big{font-size:27px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;
    line-height:1.15}
  .mkc .lbl{font-size:12.5px;color:var(--soft);margin-bottom:9px}
  .bar{height:7px;background:var(--rule);border-radius:4px;overflow:hidden;margin-bottom:5px}
  .bar span{display:block;height:100%;border-radius:4px}
  .mkc.us .bar span{background:var(--us)}
  .mkc.hk .bar span{background:var(--hk)}
  .mkc.cn .bar span{background:var(--cn)}
  .mkc .r2{font-size:12.5px;color:var(--faint)}
  .gap{padding:16px 20px;border-top:1px solid var(--rule);background:var(--panel);
    font-size:15.5px}
  .gap b{color:var(--ink)}

  /* c-suite */
  .people{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:11px}
  .p{border:1px solid var(--rule);border-radius:9px;padding:13px 15px}
  .p .nm{font-weight:600;color:var(--ink)}
  .p .ti{font-size:13.5px;color:var(--soft);margin-top:2px;line-height:1.4}
  .p .ex{font-size:12.5px;color:var(--faint);margin-top:5px}

  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:8px 11px;text-align:right;border-bottom:1px solid var(--rule)}
  th:first-child,td:first-child{text-align:left}
  th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  td{font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  td.up{color:var(--up)} td.dn{color:var(--down)}

  ul.lim{padding-left:19px;color:var(--soft);font-size:15px}
  ul.lim li{margin-bottom:8px}
  footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--rule);
    color:var(--faint);font-size:13.5px}
  .warn{background:#fff8ed;border:1px solid #f0dfc0;color:#7a5f2a;border-radius:9px;
    padding:15px 18px;margin:20px 0}
  .warn code{background:#fff;padding:2px 6px;border-radius:4px;border:1px solid #ecdcbd}
  .loading{padding:40px 0;color:var(--faint);text-align:center}

  @media(max-width:800px){
    h1{font-size:27px}
    .mk-grid{grid-template-columns:1fr}
    .mkc{border-right:none;border-bottom:1px solid var(--rule)}
    .row{grid-template-columns:62px 1fr 92px;gap:9px}
    .row .num.hide,.row .tagm{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="listview">
    <header>
      <h1 class="brand">Crosscurrent</h1>
      <p class="lede">A deep dive into the Hong Kong Stock Exchange.</p>
    </header>

    <div class="searchbar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Search the whole exchange — 0700, Tencent, HSBC, 1211…">
    </div>
    <div class="filters" id="boardF"></div>
    <div class="filters" id="drivF"></div>
    <div class="count" id="count"></div>
    <div class="rows" id="rows"></div>
    <div class="more" id="more" style="display:none">Show more</div>

    <h3 style="margin-top:48px">What this can and cannot tell you</h3>
    <ul class="lim" id="lim"></ul>
    <footer id="footer"></footer>
  </div>

  <div id="detail"></div>
</div>

<script src="data.js"></script>
<script>
(function(){
  const D=window.HKEX;
  if(!D){document.body.innerHTML='<div style="padding:60px;font-family:sans-serif">'+
    'Run <b>python run.py</b> first.</div>';return;}

  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money=v=>{if(v==null||!isFinite(v))return '—';const a=Math.abs(v),g=v<0?'-':'';
    if(a>=1e12)return g+'$'+(a/1e12).toFixed(2)+'T';
    if(a>=1e9)return g+'$'+(a/1e9).toFixed(1)+'B';
    if(a>=1e6)return g+'$'+(a/1e6).toFixed(0)+'M';return g+'$'+a.toFixed(0);};
  const pct=v=>v==null||!isFinite(v)?'—':(v*100).toFixed(1)+'%';
  const pctS=v=>v==null||!isFinite(v)?'—':(v>0?'+':'')+(v*100).toFixed(1)+'%';
  const num=(v,d)=>v==null||!isFinite(v)?'—':v.toFixed(d==null?2:d);
  const MK={us:{n:'United States',c:'var(--us)'},hk:{n:'Hong Kong',c:'var(--hk)'},
            cn:{n:'Mainland China',c:'var(--cn)'}};
  const EVCOL={high:'#137a4d',low:'#b3392e',drawdown:'#b3392e',spike:'#137a4d',
               drop:'#b3392e',rally:'#1f5fa9'};

  document.getElementById('lim').innerHTML=D.limitations.map(l=>`<li>${esc(l)}</li>`).join('');
  document.getElementById('footer').innerHTML=
    `${D.meta.n_companies.toLocaleString()} companies from HKEX's List of Securities `+
    `as at ${esc(D.meta.hkex_as_of)} · built ${esc(D.meta.generated_at.replace('T',' '))} · `+
    `benchmarks: ${Object.values(D.meta.benchmarks||{}).map(esc).join(', ')}. `+
    `Not investment advice.`;

  /* ---------- list ---------- */
  let term='',fBoard=null,fDriver=null,shown=100;
  const boards=[...new Set(D.index.map(r=>r.board))].sort();
  document.getElementById('boardF').innerHTML=
    '<button class="chip on" data-b="">All boards</button>'+
    boards.map(b=>`<button class="chip" data-b="${esc(b)}">${esc(b)}</button>`).join('');
  document.getElementById('drivF').innerHTML=
    '<button class="chip on" data-d="">Any driver</button>'+
    ['cn','hk','us'].map(k=>`<button class="chip" data-d="${k}">Moves with ${esc(MK[k].n)}</button>`).join('')+
    '<button class="chip" data-d="none">No clear driver</button>'+
    '<button class="chip" data-d="prof">Has full profile</button>';

  document.getElementById('boardF').onclick=e=>{if(e.target.dataset.b===undefined)return;
    fBoard=e.target.dataset.b||null;shown=100;
    [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===e.target));render();};
  document.getElementById('drivF').onclick=e=>{if(e.target.dataset.d===undefined)return;
    fDriver=e.target.dataset.d||null;shown=100;
    [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===e.target));render();};
  document.getElementById('q').addEventListener('input',e=>{
    term=e.target.value.trim().toLowerCase();shown=100;render();});
  document.getElementById('more').onclick=()=>{shown+=200;render();};

  function filtered(){
    return D.index.filter(r=>{
      if(fBoard&&r.board!==fBoard)return false;
      if(fDriver==='prof'){ if(!r.prof) return false; }
      else if(fDriver){const d=r.driver||'none'; if(d!==fDriver)return false;}
      if(term){
        const hay=(r.code+' '+r.ticker+' '+r.name+' '+r.hkex_name+' '+
                   (r.sector||'')+' '+(r.industry||'')).toLowerCase();
        if(!hay.includes(term))return false;
      }
      return true;
    });
  }

  function render(){
    const list=filtered();
    const withProf=D.index.filter(r=>r.prof).length;
    document.getElementById('count').innerHTML=
      `${list.length.toLocaleString()} of ${D.index.length.toLocaleString()} companies`+
      ` · <span title="Profiles come from a rate-limited source and fill in over `+
      `successive builds; charts and market analysis cover everything.">`+
      `${withProf.toLocaleString()} with full profile and leadership</span>`;
    const slice=list.slice(0,shown);
    document.getElementById('rows').innerHTML=slice.map(r=>{
      const d=r.driver||'none';
      const cc=r.chgp==null?'':(r.chgp>=0?'up':'dn');
      const px=r.px==null?'—':`${(r.cur||'HKD')==='HKD'?'HK$':''}${r.px.toFixed(2)}`;
      const mv=r.chgp==null?'':
        `${r.chg>=0?'+':''}${r.chg.toFixed(2)} (${(r.chgp*100).toFixed(2)}%)`;
      return `<div class="row" data-c="${esc(r.code)}">
        <div class="code">${esc(r.code)}</div>
        <div><div class="nm">${esc(r.name)}</div>
          <div class="sub">${esc(r.sector||r.board)}</div></div>
        <div class="px">${px}</div>
        <div class="chg ${cc}">${mv}</div>
        <div><span class="tagm t-${d}">${d==='none'?'—':esc(MK[d].n)}</span></div>
      </div>`;}).join('');
    document.getElementById('more').style.display=list.length>shown?'block':'none';
  }
  document.getElementById('rows').onclick=e=>{
    const r=e.target.closest('.row'); if(r) location.hash=r.dataset.c;};
  document.getElementById('q').addEventListener('keydown',e=>{
    if(e.key==='Enter'){const f=filtered(); if(f.length) location.hash=f[0].code;}});

  /* ---------- annotated chart ---------- */
  function chart(series,events){
    if(!series||series.length<5)return '<div style="color:#95a5b5">No price history.</div>';
    const W=980,H=340,L=56,R=18,T=34,B=30;
    const ts=d=>Date.parse(d+'T00:00:00Z');
    const x0=ts(series[0].d),x1=ts(series[series.length-1].d);
    const vs=series.map(p=>p.v),lo=Math.min(...vs),hi=Math.max(...vs);
    const pad=(hi-lo)*0.12||1, vlo=Math.max(0,lo-pad), vhi=hi+pad;
    const X=d=>L+(ts(d)-x0)/(x1-x0)*(W-L-R);
    const Y=v=>T+(1-(v-vlo)/(vhi-vlo))*(H-T-B);
    let g='';
    for(let i=0;i<=3;i++){const v=vlo+(vhi-vlo)*i/3,y=Y(v);
      g+=`<line x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e4eaf0"/>
        <text x="${L-8}" y="${(y+4).toFixed(1)}" fill="#95a5b5" font-size="12"
        text-anchor="end">${v<10?v.toFixed(2):v.toFixed(0)}</text>`;}
    let ly=null;
    series.forEach(p=>{const y=p.d.slice(0,4);
      if(y!==ly){ly=y;g+=`<text x="${X(p.d).toFixed(1)}" y="${H-8}" fill="#95a5b5"
        font-size="12" text-anchor="middle">${y}</text>`;}});
    const up=series[series.length-1].v>=series[0].v;
    g+=`<path d="${series.map((p,i)=>(i?'L':'M')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ')}"
      fill="none" stroke="${up?'#137a4d':'#b3392e'}" stroke-width="2" stroke-linejoin="round"/>`;

    // Markers only. Text labels on the plot collided with the line and each
    // other; the numbered list underneath carries the explanation instead.
    (events||[]).forEach((e,i)=>{
      const x=Math.max(L,Math.min(W-R,X(e.date))), y=Y(e.price), c=EVCOL[e.kind]||'#6b7f92';
      g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="${c}"
           opacity=".16"/>
          <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#fff"
           stroke="${c}" stroke-width="2.2"/>
          <text x="${x.toFixed(1)}" y="${(y+3.2).toFixed(1)}" fill="${c}"
           font-size="8" font-weight="700" text-anchor="middle">${i+1}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
  }

  /* ---------- three markets ---------- */
  function marketsPanel(mk){
    if(!mk||!mk.us)return '';
    const card=k=>{
      const d=mk[k]||{},r2=d.r_squared;
      const lbl=d.beta==null?'no overlap':
        (d.beta>=1.1?'amplifies it':d.beta>=0.7?'moves with it':
         d.beta>=0.35?'partly follows it':'barely follows it');
      return `<div class="mkc ${k}">
        <div class="who">${esc(MK[k].n)}</div>
        <div class="bench">vs ${esc((D.meta.benchmarks||{})[k]||'—')}</div>
        <div class="big">${num(d.beta)}</div>
        <div class="lbl">beta — ${lbl}</div>
        <div class="bar"><span style="width:${Math.min(100,Math.max(1,(r2||0)*100)).toFixed(0)}%"></span></div>
        <div class="r2">explains ${r2==null?'—':(r2*100).toFixed(0)+'%'} of weekly moves</div>
      </div>`;};
    const gap=mk.gap||{},dr=mk.driver||{};
    return `<div class="mk">
      <div class="mk-head"><div class="t">Which market moves this stock</div>
        <div class="s">Weekly returns regressed on each index — ${esc(dr.label||'')}</div></div>
      <div class="mk-grid">${card('us')}${card('hk')}${card('cn')}</div>
      <div class="gap"><b>Mainland vs Hong Kong:</b> ${esc(gap.verdict||'—')}</div>
    </div>`;
  }

  /* ---------- detail ---------- */
  async function showDetail(code){
    document.getElementById('listview').style.display='none';
    const el=document.getElementById('detail');
    el.style.display='block';
    el.innerHTML='<div class="loading">Loading…</div>';
    window.scrollTo(0,0);

    let c;
    try{
      const res=await fetch(`co/${code}.json`);
      if(!res.ok) throw new Error(res.status);
      c=await res.json();
    }catch(err){
      el.innerHTML=`<button class="back" id="back">← All companies</button>
        <div class="warn"><b>Could not load this company.</b><br>
        The page loads one file per company, and browsers block that when the page is
        opened directly from your file system. Run <code>python serve.py</code> and use
        the address it prints.</div>`;
      document.getElementById('back').onclick=()=>{location.hash='';};
      return;
    }

    const p=c.profile||{},ps=c.price||{},off=p.officers||[];
    const m=(k,v,cls)=>`<div class="m"><div class="k">${k}</div>
      <div class="v ${cls||''}">${v}</div></div>`;
    const rows=[['1 year','1y'],['3 years','3y'],['5 years','5y']].map(([l,k])=>{
      const r=ps['return_'+k],g=ps['cagr_'+k];
      if(r==null)return '';
      return `<tr><td>${l}</td><td class="${r>=0?'up':'dn'}">${pctS(r)}</td>
        <td class="${g==null?'':(g>=0?'up':'dn')}">${g==null?'—':pctS(g)}</td></tr>`;}).join('');

    const q=c.quote||{};
    const cur=(q.currency||'HKD')==='HKD'?'HK$':'';
    const qcls=q.change_pct==null?'':(q.change_pct>=0?'up':'dn');

    el.innerHTML=`
      <button class="back" id="back">← All companies</button>
      <div class="dhead">
        <h1>${esc(c.name)}</h1>
        ${c.read&&c.read.length?`<p class="dread">${
          c.read.map(esc).join(' ')}</p>`:''}
        <div class="quotebar">
          <span class="big">${q.price==null?'—':cur+q.price.toFixed(2)}</span>
          <span class="mv ${qcls}">${q.change_pct==null?'':
            `${q.change>=0?'+':''}${q.change.toFixed(2)} (${(q.change_pct*100).toFixed(2)}%)`}</span>
          <span class="asof">at close ${esc(q.as_of||'—')}</span>
        </div>
        <div class="dmeta"><b>${esc(c.code)}</b> · ${esc(c.ticker)} · ${esc(c.board)}
          ${p.employees?` · ${p.employees.toLocaleString()} employees`:''}
          ${p.sector?` · ${esc(p.sector)}`:''}${p.industry?` · ${esc(p.industry)}`:''}</div>
      </div>

      <div class="metrics">
        ${m('Market cap',money(p.market_cap_usd))}
        ${m('Revenue',money(p.revenue_usd))}
        ${m('1-year',pctS(ps.return_1y),ps.return_1y==null?'':(ps.return_1y>=0?'up':'dn'))}
        ${m('Net margin',pct(p.profit_margin),p.profit_margin==null?'':(p.profit_margin>=0?'up':'dn'))}
        ${m('P/E',num(p.pe,1))}
        ${m('Price / book',num(p.price_to_book,1))}
        ${m('Dividend yield',pct(p.dividend_yield))}
        ${m('Volatility',pct(ps.volatility))}
      </div>

      <div class="box"><h3>Share price · last five years</h3>
        ${chart(c.series,c.events)}
        ${c.events&&c.events.length?`<div class="evlist">${c.events.map((e,i)=>
          `<div class="ev"><span class="dot" style="background:${EVCOL[e.kind]||'#6b7f92'}"></span>
            <span class="d">${esc(e.date)}</span>
            <span><b style="color:var(--ink)">${esc(e.title)}</b> — ${esc(e.detail)}
            ${e.context?` <span style="color:var(--soft)">${esc(e.context)}</span>`:''}</span>
          </div>`).join('')}</div>`:''}
      </div>

      ${marketsPanel(c.markets)}

      ${p.summary?`<div class="about"><h3>About the company</h3>
        <p>${esc(p.summary)}</p></div>`:''}

      <div class="box"><h3>Leadership</h3>
        ${off.length?`<div class="people">${off.map(o=>`<div class="p">
          <div class="nm">${esc(o.name)}</div>
          <div class="ti">${esc(o.title||'—')}</div>
          ${(o.age||o.pay)?`<div class="ex">${o.age?`age ${o.age}`:''}${
            o.age&&o.pay?' · ':''}${o.pay?`pay ${money(o.pay)}`:''}</div>`:''}
        </div>`).join('')}</div>`
        :`<div style="color:#95a5b5">Not yet fetched for this company. Leadership and
          company details come from a source that limits how many companies can be
          requested per build, so coverage fills in over successive runs, largest
          companies first. The price history and market analysis above are complete.</div>`}
      </div>

      <div class="box"><h3>Returns</h3>
        <table><tr><th>Period</th><th>Total</th><th>Per year</th></tr>
        ${rows||'<tr><td colspan="3">No history</td></tr>'}</table></div>`;

    document.getElementById('back').onclick=()=>{location.hash='';};
  }

  function route(){
    const h=decodeURIComponent(location.hash.slice(1));
    if(h){showDetail(h);}
    else{document.getElementById('detail').style.display='none';
         document.getElementById('listview').style.display='block';}
  }
  window.addEventListener('hashchange',route);
  render(); route();
})();
</script>
</body>
</html>
