# Nightly rebuild and deploy.
#
# The engine runs here, not in the browser. This job fetches data, fits the
# regime model, and publishes the resulting static page to GitHub Pages. The
# site itself never makes a live call, so a Chinese endpoint having a bad day
# can never break the page a visitor is looking at — it just means the numbers
# are one day stale.
name: Build and deploy

on:
  schedule:
    # Intraday quote refresh, every 30 minutes through the Hong Kong session.
    # HKT is UTC+8, so 09:30-16:00 local is 01:30-08:00 UTC. Prices only —
    # the profile endpoint is rate-limited and must not be touched this often.
    - cron: "*/30 1-8 * * 1-5"
    # Full nightly build: refreshes everything and takes the next slice of
    # company profiles. 22:00 UTC is after the US close and well clear of the
    # next Hong Kong open.
    - cron: "0 22 * * 1-5"
  # Lets you trigger a build by hand from the Actions tab.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Company profiles come from a rate-limited endpoint that will not serve
      # the whole board in one run, so each build takes a slice and the cache
      # carries what has already been collected. Without this the nightly job
      # would restart from zero every night and coverage would never grow.
      # The key rotates daily; restore-keys pull the most recent previous cache.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/hkcache
          key: hkcache-${{ github.run_id }}
          restore-keys: |
            hkcache-

      # The interesting one. This runner is not behind the WatchGuard firewall
      # that geo-blocks China-hosted IPs on the local network, so the A-share
      # sources may work here even though they fail on the laptop. Allowed to
      # fail — it is a probe, not a dependency. Read the uploaded JSON to find
      # out, then widen the universe in transmission/universe.py if it passes.
      # Only worth running on the nightly pass, not every 30 minutes.
      - name: Probe data sources (is the A-share leg reachable from CI?)
        if: github.event.schedule != '*/30 1-8 * * 1-5'
        continue-on-error: true
        timeout-minutes: 10
        run: python phase0_data_audit.py

      - name: Upload audit results
        if: always() && github.event.schedule != '*/30 1-8 * * 1-5'
        uses: actions/upload-artifact@v4
        with:
          name: data-source-audit
          path: phase0_audit_results.json
          if-no-files-found: warn
          retention-days: 30

      # Intraday runs refresh prices only. Everything else — nightly, manual,
      # and pushes to main — does the full build including the profile slice.
      - name: Build
        run: |
          if [ "${{ github.event.schedule }}" = "*/30 1-8 * * 1-5" ]; then
            echo "Intraday quote refresh"
            python run.py --quotes
          else
            echo "Full build"
            python run.py
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
